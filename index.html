<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Westminster Chimes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #344d68, #172238 55%, #080c14);
    }

    .clock {
      width: 100%;
      max-width: 540px;
      padding: 32px 24px;
      text-align: center;
      border: 3px solid #d4af37;
      border-radius: 24px;
      background: rgba(8, 14, 28, 0.94);
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.65);
    }

    h1 {
      margin: 0 0 10px;
      color: #f3cf62;
      font-family: Georgia, serif;
      font-size: 38px;
    }

    .subtitle {
      margin-bottom: 20px;
      color: #c9d4e5;
      font-size: 17px;
    }

    .bell {
      margin: 10px 0;
      font-size: 76px;
      filter: drop-shadow(0 5px 8px rgba(212, 175, 55, 0.35));
    }

    #time {
      margin: 10px 0;
      font-size: clamp(48px, 13vw, 76px);
      font-weight: bold;
      letter-spacing: 2px;
    }

    #date {
      margin-bottom: 24px;
      color: #d6deea;
      font-size: 20px;
    }

    .sound-box {
      margin: 16px 0;
      padding: 16px;
      border: 1px solid #596982;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #e4eaf3;
      font-weight: bold;
    }

    select {
      width: 100%;
      min-height: 48px;
      padding: 10px;
      border: 2px solid #d4af37;
      border-radius: 10px;
      color: #172238;
      background: white;
      font-size: 17px;
      font-weight: bold;
    }

    #status {
      min-height: 25px;
      margin: 18px 0;
      color: #f3cf62;
      font-size: 17px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      min-height: 54px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      color: #111827;
      background: #f3cf62;
    }

    #testButton {
      background: #276749;
    }

    #stopButton {
      background: #9b2c2c;
    }

    #muteButton {
      background: #35465f;
    }

    button:active {
      transform: scale(0.98);
    }

    .volume-box {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #4b5870;
    }

    input[type="range"] {
      width: 100%;
    }

    .note {
      margin-top: 22px;
      color: #aebbd0;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      .buttons {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 31px;
      }
    }
  </style>
</head>

<body>
  <main class="clock">
    <h1>Westminster Chimes</h1>

    <div class="subtitle">
      Traditional clock and tower bells
    </div>

    <div class="bell">🔔</div>

    <div id="time">--:--:--</div>
    <div id="date">Loading date…</div>

    <div class="sound-box">
      <label for="soundChoice">Choose a chime sound</label>

      <select id="soundChoice">
        <option value="westminster">
          Westminster Tower Bells
        </option>

        <option value="bigben">
          Big Ben — London
        </option>
      </select>
    </div>

    <div id="status">Press Start Chimes to begin.</div>

    <div class="buttons">
      <button id="startButton">Start Chimes</button>
      <button id="testButton">Test Selected Chime</button>
      <button id="stopButton">Stop Chimes</button>
      <button id="muteButton">Mute</button>
    </div>

    <div class="volume-box">
      <label for="volume">
        Volume: <span id="volumeValue">60</span>%
      </label>

      <input id="volume" type="range" min="0" max="100" value="60">
    </div>

    <div class="note">
      Select a sound, then press Test Selected Chime.
      Keep this page open and press Start Chimes once for
      automatic quarter-hour chimes.
    </div>
  </main>

  <script>
    const timeDisplay = document.getElementById("time");
    const dateDisplay = document.getElementById("date");
    const statusDisplay = document.getElementById("status");

    const soundChoice = document.getElementById("soundChoice");
    const startButton = document.getElementById("startButton");
    const testButton = document.getElementById("testButton");
    const stopButton = document.getElementById("stopButton");
    const muteButton = document.getElementById("muteButton");

    const volumeSlider = document.getElementById("volume");
    const volumeValue = document.getElementById("volumeValue");

    let audioContext;
    let masterGain;
    let chimesEnabled = false;
    let muted = false;
    let lastChimeKey = "";

    const notes = {
      B3: 246.94,
      E4: 329.63,
      FS4: 369.99,
      GS4: 415.30,
      E3: 164.81
    };

    const firstQuarter = [
      ["GS4", 0.00],
      ["FS4", 0.82],
      ["E4", 1.64],
      ["B3", 2.46]
    ];

    const secondQuarter = [
      ["E4", 0.00],
      ["GS4", 0.82],
      ["FS4", 1.64],
      ["B3", 2.46],

      ["E4", 3.65],
      ["FS4", 4.47],
      ["GS4", 5.29],
      ["E4", 6.11]
    ];

    const thirdQuarter = [
      ["GS4", 0.00],
      ["E4", 0.82],
      ["FS4", 1.64],
      ["B3", 2.46],

      ["B3", 3.65],
      ["FS4", 4.47],
      ["GS4", 5.29],
      ["E4", 6.11],

      ["GS4", 7.30],
      ["FS4", 8.12],
      ["E4", 8.94],
      ["B3", 9.76]
    ];

    const fullHour = [
      ["E4", 0.00],
      ["GS4", 0.82],
      ["FS4", 1.64],
      ["B3", 2.46],

      ["E4", 3.65],
      ["FS4", 4.47],
      ["GS4", 5.29],
      ["E4", 6.11],

      ["GS4", 7.30],
      ["E4", 8.12],
      ["FS4", 8.94],
      ["B3", 9.76],

      ["B3", 10.95],
      ["FS4", 11.77],
      ["GS4", 12.59],
      ["E4", 13.41]
    ];

    function getVolume() {
      return muted ? 0 : Number(volumeSlider.value) / 100;
    }

    function prepareAudio() {
      if (!audioContext) {
        const AudioContext =
          window.AudioContext || window.webkitAudioContext;

        audioContext = new AudioContext();
        masterGain = audioContext.createGain();
        masterGain.connect(audioContext.destination);
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      masterGain.gain.setValueAtTime(
        getVolume(),
        audioContext.currentTime
      );
    }

    function getBellSettings(style, hourBell) {
      if (style === "bigben") {
        if (hourBell) {
          return {
            pitch: 0.79,
            duration: 8.2,
            harmonics: [
              [0.50, 0.50, 1.00],
              [1.00, 0.62, 1.00],
              [1.47, 0.24, 0.82],
              [2.00, 0.18, 0.67],
              [2.63, 0.12, 0.52],
              [3.52, 0.07, 0.38],
              [4.11, 0.04, 0.27]
            ]
          };
        }

        return {
          pitch: 0.88,
          duration: 6.2,
          harmonics: [
            [0.50, 0.37, 1.00],
            [1.00, 0.54, 1.00],
            [1.49, 0.22, 0.82],
            [2.00, 0.17, 0.67],
            [2.71, 0.11, 0.51],
            [3.68, 0.06, 0.36]
          ]
        };
      }

      if (hourBell) {
        return {
          pitch: 1.00,
          duration: 6.5,
          harmonics: [
            [0.50, 0.42, 1.00],
            [1.00, 0.55, 1.00],
            [1.48, 0.19, 0.78],
            [2.00, 0.15, 0.60],
            [2.66, 0.09, 0.45],
            [3.55, 0.05, 0.32]
          ]
        };
      }

      return {
        pitch: 1.00,
        duration: 4.8,
        harmonics: [
          [0.50, 0.30, 1.00],
          [1.00, 0.48, 1.00],
          [1.50, 0.18, 0.78],
          [2.00, 0.14, 0.62],
          [2.74, 0.09, 0.48],
          [3.76, 0.05, 0.35]
        ]
      };
    }

    function playBell(frequency, delay, hourBell = false) {
      if (!audioContext || muted) {
        return;
      }

      const style = soundChoice.value;
      const settings = getBellSettings(style, hourBell);
      const start = audioContext.currentTime + delay;

      settings.harmonics.forEach(harmonic => {
        const ratio = harmonic[0];
        const amount = harmonic[1];
        const fade = harmonic[2];

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
          frequency * settings.pitch * ratio,
          start
        );

        oscillator.detune.setValueAtTime(
          style === "bigben" ? -4 : 0,
          start
        );

        gain.gain.setValueAtTime(0.0001, start);

        gain.gain.exponentialRampToValueAtTime(
          Math.max(0.001, amount),
          start + 0.03
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          start + settings.duration * fade
        );

        oscillator.connect(gain);
        gain.connect(masterGain);

        oscillator.start(start);
        oscillator.stop(start + settings.duration + 0.2);
      });
    }

    function playSequence(sequence) {
      prepareAudio();

      sequence.forEach(([note, delay]) => {
        playBell(notes[note], delay, false);
      });
    }

    function strikeHour(hour, delay) {
      let strikes = hour % 12;

      if (strikes === 0) {
        strikes = 12;
      }

      const spacing =
        soundChoice.value === "bigben" ? 3.8 : 3.15;

      for (let i = 0; i < strikes; i++) {
        playBell(notes.E3, delay + i * spacing, true);
      }
    }

    function playQuarterChime(minutes, hour) {
      if (!chimesEnabled || muted) {
        return;
      }

      if (minutes === 15) {
        statusDisplay.textContent =
          "Playing the quarter-hour chime.";

        playSequence(firstQuarter);
      }

      if (minutes === 30) {
        statusDisplay.textContent =
          "Playing the half-hour chime.";

        playSequence(secondQuarter);
      }

      if (minutes === 45) {
        statusDisplay.textContent =
          "Playing the three-quarter-hour chime.";

        playSequence(thirdQuarter);
      }

      if (minutes === 0) {
        statusDisplay.textContent =
          "Playing the full chime and hour strikes.";

        playSequence(fullHour);
        strikeHour(hour, 15.8);
      }
    }

    function checkForChime(now) {
      if (!chimesEnabled) {
        return;
      }

      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      if (![0, 15, 30, 45].includes(minutes) || seconds > 1) {
        return;
      }

      const chimeKey =
        now.getFullYear() + "-" +
        now.getMonth() + "-" +
        now.getDate() + "-" +
        now.getHours() + "-" +
        minutes;

      if (chimeKey === lastChimeKey) {
        return;
      }

      lastChimeKey = chimeKey;
      playQuarterChime(minutes, now.getHours());
    }

    function updateClock() {
      const now = new Date();

      timeDisplay.textContent = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit"
      });

      dateDisplay.textContent = now.toLocaleDateString([], {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });

      checkForChime(now);
    }

    startButton.addEventListener("click", () => {
      prepareAudio();

      chimesEnabled = true;
      muted = false;
      muteButton.textContent = "Mute";

      masterGain.gain.setValueAtTime(
        getVolume(),
        audioContext.currentTime
      );

      const name =
        soundChoice.value === "bigben"
          ? "Big Ben"
          : "Westminster Tower Bells";

      statusDisplay.textContent =
        name + " chimes are on.";
    });

    testButton.addEventListener("click", () => {
      prepareAudio();

      muted = false;
      muteButton.textContent = "Mute";

      masterGain.gain.setValueAtTime(
        getVolume(),
        audioContext.currentTime
      );

      const name =
        soundChoice.value === "bigben"
          ? "Big Ben"
          : "Westminster Tower Bells";

      statusDisplay.textContent =
        "Playing " + name + ".";

      playSequence(fullHour);
      playBell(notes.E3, 15.8, true);
    });

    stopButton.addEventListener("click", () => {
      chimesEnabled = false;

      statusDisplay.textContent =
        "Automatic chimes are stopped.";
    });

    muteButton.addEventListener("click", () => {
      prepareAudio();

      muted = !muted;
      muteButton.textContent = muted ? "Unmute" : "Mute";

      masterGain.gain.setValueAtTime(
        getVolume(),
        audioContext.currentTime
      );

      statusDisplay.textContent = muted
        ? "Sound is muted."
        : "Sound is unmuted.";
    });

    soundChoice.addEventListener("change", () => {
      const name =
        soundChoice.value === "bigben"
          ? "Big Ben"
          : "Westminster Tower Bells";

      statusDisplay.textContent =
        name + " selected. Press Test Selected Chime.";
    });

    volumeSlider.addEventListener("input", () => {
      volumeValue.textContent = volumeSlider.value;

      if (masterGain && audioContext) {
        masterGain.gain.setValueAtTime(
          getVolume(),
          audioContext.currentTime
        );
      }
    });

    updateClock();
    setInterval(updateClock, 500);
  </script>
</body>
</html>
