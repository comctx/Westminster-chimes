<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Westminster Chimes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: radial-gradient(circle at top, #355c7d, #17223b 60%, #090d18);
    }

    .clock {
      width: 100%;
      max-width: 520px;
      padding: 32px 24px;
      text-align: center;
      border: 3px solid #d4af37;
      border-radius: 24px;
      background: rgba(8, 14, 28, 0.92);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
    }

    h1 {
      margin: 0 0 10px;
      color: #f3cf62;
      font-family: Georgia, serif;
      font-size: 38px;
    }

    .subtitle {
      margin-bottom: 26px;
      color: #c9d4e5;
      font-size: 17px;
    }

    #time {
      margin: 10px 0;
      font-size: clamp(48px, 13vw, 76px);
      font-weight: bold;
      letter-spacing: 2px;
    }

    #date {
      margin-bottom: 28px;
      color: #d6deea;
      font-size: 20px;
    }

    .bell {
      margin: 15px 0;
      font-size: 76px;
    }

    #status {
      min-height: 24px;
      margin: 18px 0;
      color: #f3cf62;
      font-size: 17px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      min-height: 54px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      color: #111827;
      background: #f3cf62;
    }

    #testButton {
      background: #276749;
    }

    #stopButton {
      background: #9b2c2c;
    }

    #muteButton {
      background: #35465f;
    }

    button:active {
      transform: scale(0.98);
    }

    .volume-box {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #4b5870;
    }

    label {
      display: block;
      margin-bottom: 10px;
    }

    input[type="range"] {
      width: 100%;
    }

    .note {
      margin-top: 22px;
      color: #aebbd0;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      .buttons {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 31px;
      }
    }
  </style>
</head>

<body>
  <main class="clock">
    <h1>Westminster Chimes</h1>

    <div class="subtitle">
      Traditional quarter-hour clock chimes
    </div>

    <div class="bell">🔔</div>

    <div id="time">--:--:--</div>
    <div id="date">Loading date…</div>

    <div id="status">Press Start Chimes to begin.</div>

    <div class="buttons">
      <button id="startButton">Start Chimes</button>
      <button id="testButton">Test Chimes</button>
      <button id="stopButton">Stop Chimes</button>
      <button id="muteButton">Mute</button>
    </div>

    <div class="volume-box">
      <label for="volume">
        Volume: <span id="volumeValue">60</span>%
      </label>

      <input id="volume" type="range" min="0" max="100" value="60">
    </div>

    <div class="note">
      Keep this page open. Your browser requires you to press
      “Start Chimes” before it can play sound automatically.
    </div>
  </main>

  <script>
    const timeDisplay = document.getElementById("time");
    const dateDisplay = document.getElementById("date");
    const statusDisplay = document.getElementById("status");

    const startButton = document.getElementById("startButton");
    const testButton = document.getElementById("testButton");
    const stopButton = document.getElementById("stopButton");
    const muteButton = document.getElementById("muteButton");

    const volumeSlider = document.getElementById("volume");
    const volumeValue = document.getElementById("volumeValue");

    let audioContext = null;
    let chimesEnabled = false;
    let muted = false;
    let lastChimeKey = "";

    const notes = {
      E4: 329.63,
      G4: 392.00,
      A4: 440.00,
      B4: 493.88
    };

    const quarterOne = [
      ["G4", 0],
      ["E4", 0.55],
      ["A4", 1.10],
      ["B4", 1.65]
    ];

    const quarterTwo = [
      ["E4", 0],
      ["G4", 0.55],
      ["A4", 1.10],
      ["B4", 1.65],
      ["E4", 2.45],
      ["A4", 3.00],
      ["G4", 3.55],
      ["E4", 4.10]
    ];

    const quarterThree = [
      ["G4", 0],
      ["E4", 0.55],
      ["A4", 1.10],
      ["B4", 1.65],
      ["E4", 2.45],
      ["G4", 3.00],
      ["A4", 3.55],
      ["B4", 4.10],
      ["G4", 4.90],
      ["A4", 5.45],
      ["E4", 6.00],
      ["G4", 6.55]
    ];

    const fullHour = [
      ["G4", 0],
      ["E4", 0.55],
      ["A4", 1.10],
      ["B4", 1.65],
      ["E4", 2.45],
      ["G4", 3.00],
      ["A4", 3.55],
      ["B4", 4.10],
      ["G4", 4.90],
      ["A4", 5.45],
      ["E4", 6.00],
      ["G4", 6.55],
      ["E4", 7.35],
      ["A4", 7.90],
      ["B4", 8.45],
      ["E4", 9.00]
    ];

    function getVolume() {
      return muted ? 0 : Number(volumeSlider.value) / 100;
    }

    function prepareAudio() {
      if (!audioContext) {
        const AudioContext =
          window.AudioContext || window.webkitAudioContext;

        audioContext = new AudioContext();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
    }

    function playBell(frequency, startDelay, duration = 1.2) {
      if (!audioContext || muted) {
        return;
      }

      const startTime = audioContext.currentTime + startDelay;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(frequency, startTime);

      gain.gain.setValueAtTime(0.0001, startTime);
      gain.gain.exponentialRampToValueAtTime(
        Math.max(0.001, getVolume() * 0.45),
        startTime + 0.03
      );

      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        startTime + duration
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(startTime);
      oscillator.stop(startTime + duration + 0.1);
    }

    function playSequence(sequence) {
      prepareAudio();

      sequence.forEach(([note, delay]) => {
        playBell(notes[note], delay);
      });
    }

    function strikeHour(hour, delay) {
      let strikes = hour % 12;

      if (strikes === 0) {
        strikes = 12;
      }

      for (let i = 0; i < strikes; i++) {
        playBell(notes.E4, delay + i * 1.45, 1.3);
      }
    }

    function playQuarterChime(minutes, hour) {
      if (!chimesEnabled || muted) {
        return;
      }

      if (minutes === 15) {
        statusDisplay.textContent = "Playing quarter-hour chime.";
        playSequence(quarterOne);
      }

      if (minutes === 30) {
        statusDisplay.textContent = "Playing half-hour chime.";
        playSequence(quarterTwo);
      }

      if (minutes === 45) {
        statusDisplay.textContent = "Playing three-quarter-hour chime.";
        playSequence(quarterThree);
      }

      if (minutes === 0) {
        statusDisplay.textContent = "Playing the hour chime.";
        playSequence(fullHour);
        strikeHour(hour, 10.7);
      }
    }

    function checkForChime(now) {
      if (!chimesEnabled) {
        return;
      }

      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      if (![0, 15, 30, 45].includes(minutes) || seconds > 1) {
        return;
      }

      const chimeKey =
        now.getFullYear() + "-" +
        now.getMonth() + "-" +
        now.getDate() + "-" +
        now.getHours() + "-" +
        minutes;

      if (chimeKey === lastChimeKey) {
        return;
      }

      lastChimeKey = chimeKey;
      playQuarterChime(minutes, now.getHours());
    }

    function updateClock() {
      const now = new Date();

      timeDisplay.textContent = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit"
      });

      dateDisplay.textContent = now.toLocaleDateString([], {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });

      checkForChime(now);
    }

    startButton.addEventListener("click", () => {
      prepareAudio();
      chimesEnabled = true;
      muted = false;
      muteButton.textContent = "Mute";

      statusDisplay.textContent =
        "Chimes are on and waiting for the next quarter hour.";
    });

    testButton.addEventListener("click", () => {
      prepareAudio();
      muted = false;
      muteButton.textContent = "Mute";

      statusDisplay.textContent =
        "Playing a Westminster test chime.";

      playSequence(quarterOne);
    });

    stopButton.addEventListener("click", () => {
      chimesEnabled = false;
      statusDisplay.textContent = "Automatic chimes are stopped.";
    });

    muteButton.addEventListener("click", () => {
      muted = !muted;
      muteButton.textContent = muted ? "Unmute" : "Mute";

      statusDisplay.textContent = muted
        ? "Sound is muted."
        : "Sound is unmuted.";
    });

    volumeSlider.addEventListener("input", () => {
      volumeValue.textContent = volumeSlider.value;
    });

    updateClock();
    setInterval(updateClock, 500);
  </script>
</body>
</html>
