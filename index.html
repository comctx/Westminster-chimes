<body>
<main class="clock">
  <h1>Clock Tower Chimes</h1>
  <div class="subtitle">Traditional clocks and tower melodies</div>
  <div id="buildMarker" style="margin-top:6px;font-size:12px;opacity:.75;">Quiet Hours Fix v4</div>
  <div class="bell" id="clockIcon">🔔</div>

  <div id="time">--:--:--</div>
  <div id="date">Loading date…</div>

  <div class="settings">
    <div>
      <label for="soundChoice">Choose a chime</label>
      <select id="soundChoice">
        <option value="westminster">Westminster Tower Bells</option>
        <option value="bigben">Big Ben — London</option>
        <option value="whittington">Whittington Chimes</option>
        <option value="stmichael">St. Michael Chimes</option>
        <option value="canterbury">Canterbury Chimes</option>
        <option value="cuckoo">Black Forest Cuckoo Clock</option>
      </select>
    </div>

    <div>
      <label for="scheduleChoice">Chime schedule</label>
      <select id="scheduleChoice">
        <option value="quarters">Every Quarter Hour</option>
        <option value="hourly">On the Hour Only</option>
      </select>
    </div>

    <div class="quiet-box">
      <label class="quiet-toggle" for="quietEnabled">
        <input id="quietEnabled" type="checkbox">
        Quiet Hours
      </label>
      <div class="quiet-times">
        <div>
          <label for="quietStart">Quiet from</label>
          <select id="quietStart"></select>
        </div>
        <div>
          <label for="quietEnd">Resume at</label>
          <select id="quietEnd"></select>
        </div>
      </div>

    </div>
  </div>

  <div id="status">Press Start Chimes to begin.</div>

  <div class="buttons">
    <button id="startButton">Start Chimes</button>
    <button id="testButton">Test Selected Chime</button>
    <button id="stopButton">Stop Chimes</button>
    <button id="muteButton">Mute</button>
  </div>

  <div class="volume-box">
    <label for="volume">
      Volume: <span id="volumeValue">60</span>%
    </label>
    <input id="volume" type="range" min="0" max="100" value="60">
  </div>

  <div class="note" id="scheduleNote">
    Select a chime and schedule, then press Start Chimes.
  </div>

  <div style="text-align:center; padding:18px 10px 4px; font-size:13px; opacity:.65;">
    A&nbsp;DONCO-BAYCITY™ App

<script>
const $=id=>document.getElementById(id);

const timeDisplay=$("time");
const dateDisplay=$("date");
const statusDisplay=$("status");
const soundChoice=$("soundChoice");
const scheduleChoice=$("scheduleChoice");
const startButton=$("startButton");
const testButton=$("testButton");
const stopButton=$("stopButton");
const muteButton=$("muteButton");
const volumeSlider=$("volume");
const volumeValue=$("volumeValue");
const clockIcon=$("clockIcon");
const scheduleNote=$("scheduleNote");
const quietEnabled=$("quietEnabled");
const quietStart=$("quietStart");
const quietEnd=$("quietEnd");
const quietStatus=$("quietStatus");

let audioContext;
let masterGain;
let enabled=localStorage.getItem("chimesEnabled")==="true";
let muted=false;

let lastChimeKey="";

// Native iPhone locked-screen scheduling.
// This is intentionally separate from the Web Audio clock.
// When available, Capacitor Local Notifications is rebuilt whenever
// Start, Stop, sound, schedule, or Quiet Hours settings change.
function getLocalNotifications(){
  try{
    return window.Capacitor &&
           window.Capacitor.Plugins &&
           window.Capacitor.Plugins.LocalNotifications
      ? window.Capacitor.Plugins.LocalNotifications
      : null;
  }catch(e){
    return null;
  }
}

function quietAtHour(hour){
  if(!quietEnabled.checked)return false;

  const start=Number(quietStart.value);
  const end=Number(quietEnd.value);

  if(start===end)return true;
  if(start<end)return hour>=start && hour<end;
  return hour>=start || hour<end;
}

function lockedMinutes(){
  if(scheduleChoice.value==="hourly")return [0];
  if(getStyle()==="cuckoo")return [0,30];
  return [0,15,30,45];
}

function lockedSoundName(hour,minute){
  const style=getStyle();
  const h=((Number(hour)+11)%12)+1;

  if(Number(minute)===0){
    return `${style}-h${h}.wav`;
  }

  return `${style}-m${Number(minute)}.wav`;
}

async function cancelAllLockedChimes(){
  const LN=getLocalNotifications();
  if(!LN)return false;

  try{
    const pending=await LN.getPending();
    const list=(pending&&pending.notifications)||[];

    if(list.length){
      await LN.cancel({
        notifications:list.map(n=>({id:n.id}))
      });
    }
    return true;
  }catch(e){
    console.warn("Could not cancel locked-phone chimes",e);
    return false;
  }
}

function nextAllowedTimes(maxCount){
  const result=[];
  const mins=lockedMinutes();

  // Start at the next whole minute.
  let cursor=new Date();
  cursor.setSeconds(0,0);
  cursor.setMinutes(cursor.getMinutes()+1);

  // Search forward up to 8 days for allowed chime moments.
  const end=new Date(cursor.getTime()+8*24*60*60*1000);

  while(cursor<end && result.length<maxCount){
    const h=cursor.getHours();
    const m=cursor.getMinutes();

    if(!quietAtHour(h) && mins.includes(m)){
      result.push(new Date(cursor));
    }
    cursor.setMinutes(cursor.getMinutes()+1);
  }
  return result;
}

async function syncLockedPhoneChimes(){
  const LN=getLocalNotifications();
  if(!LN)return false;

  try{
    let perm=await LN.checkPermissions();
    if(!perm || perm.display!=="granted"){
      perm=await LN.requestPermissions();
    }

    if(!perm || perm.display!=="granted"){
      console.warn("Notification permission not granted.");
      return false;
    }

    // Important: remove every previously scheduled notification from this app.
    // That clears old TestFlight/background schedules that ignored Quiet Hours.
    await cancelAllLockedChimes();

    if(!enabled || muted)return true;

    const mins=lockedMinutes();
    const allowedDaily=[];

    for(let hour=0;hour<24;hour++){
      if(quietAtHour(hour))continue;
      for(const minute of mins){
        allowedDaily.push({hour,minute});
      }
    }

    const notifications=[];

    // iOS keeps at most 64 pending local notifications per app.
    // When the daily repeating plan fits, use repeating clock times.
    if(allowedDaily.length<=64){
      allowedDaily.forEach((t,i)=>{
        const sound=lockedSoundName(t.hour,t.minute);
        notifications.push({
          id:710000+i,
          title:"Westminster Chimes",
          body:"Clock chime",
          sound,
          schedule:{
            on:{hour:t.hour,minute:t.minute,second:0}
          },
          extra:{kind:"westminster-chime"}
        });
      });
    }else{
      // If Quiet Hours are off or too short, keep the next 64 allowed
      // chimes scheduled. They are refreshed whenever the app is opened
      // or a setting changes.
      nextAllowedTimes(64).forEach((at,i)=>{
        const sound=lockedSoundName(at.getHours(),at.getMinutes());
        notifications.push({
          id:710000+i,
          title:"Westminster Chimes",
          body:"Clock chime",
          sound,
          schedule:{at},
          extra:{kind:"westminster-chime"}
        });
      });
    }

    if(notifications.length){
      await LN.schedule({notifications});
    }

    return true;
  }catch(e){
    console.warn("Locked-phone schedule update failed",e);
    return false;
  }
}


const names={
  westminster:"Westminster Tower Bells",
  bigben:"Big Ben",
  whittington:"Whittington Chimes",
  stmichael:"St. Michael Chimes",
  canterbury:"Canterbury Chimes",
  cuckoo:"Black Forest Cuckoo Clock"
};

const notes={
  westminster:{
    1:246.94,2:329.63,3:369.99,4:415.30,strike:164.81
  },
  whittington:{
    1:293.66,2:329.63,3:369.99,4:392,
    5:440,6:493.88,7:554.37,8:587.33,strike:146.83
  },
  stmichael:{
    1:349.23,2:392,3:440,4:466.16,
    5:523.25,6:587.33,7:659.25,8:698.46,strike:174.61
  },
  canterbury:{
    1:293.66,2:329.63,3:369.99,
    4:392,5:440,6:493.88,strike:146.83
  }
};

const melodies={
  westminster:{
    15:[[4,3,2,1]],
    30:[[2,4,3,1],[2,3,4,2]],
    45:[[4,2,3,1],[1,3,4,2],[4,3,2,1]],
    0:[[2,4,3,1],[2,3,4,2],[4,2,3,1],[1,3,4,2]]
  },

  whittington:{
    15:[[8,7,6,5,4,3,2,1]],
    30:[
      [8,2,7,3,6,4,5,1],
      [8,6,4,2,7,5,3,1]
    ],
    45:[
      [8,7,4,3,6,5,2,1],
      [2,4,6,8,5,2,3,1],
      [8,7,6,5,4,3,2,1]
    ],
    0:[
      [8,2,7,3,6,4,5,1],
      [8,6,4,2,7,5,3,1],
      [8,7,4,3,6,5,2,1],
      [2,4,6,8,5,2,3,1]
    ]
  },

  stmichael:{
    15:[[8,7,6,5,4,3,2,1]],
    30:[
      [8,2,3,4,7,5,6,1],
      [5,4,3,6,2,7,8,1]
    ],
    45:[
      [7,8,3,4,2,5,6,1],
      [5,7,3,8,4,2,6,1],
      [8,7,6,5,4,3,2,1]
    ],
    0:[
      [8,2,3,4,7,5,6,1],
      [5,4,3,6,2,7,8,1],
      [7,8,3,4,2,5,6,1],
      [5,7,3,8,4,2,6,1]
    ]
  },

  canterbury:{
    15:[[6,4,2,5,3,1]],
    30:[
      [2,4,6,3,1,5],
      [4,6,2,5,1,3]
    ],
    45:[
      [1,6,4,2,3,5],
      [4,6,2,5,1,3],
      [6,4,2,3,5,1]
    ],
    0:[
      [3,1,6,4,2,5],
      [4,6,2,5,1,3],
      [3,1,6,4,2,5],
      [4,6,5,3,2,1]
    ]
  }
};

function getStyle(){
  return soundChoice.value;
}

function getMusicStyle(){
  return getStyle()==="bigben"?"westminster":getStyle();
}

function getName(){
  return names[getStyle()];
}

function getNormalVolume(){
  return muted?0:Number(volumeSlider.value)/100;
}

function getVolume(){
  // Absolute fail-safe: Quiet Hours always means zero output.
  return isQuietTime(new Date()) ? 0 : getNormalVolume();
}

function prepareAudio(){
  // Never start or restart audio while Quiet Hours are active.
  if(isQuietTime(new Date()))return false;

  if(!audioContext || audioContext.state==="closed"){
    const AudioContext=window.AudioContext||window.webkitAudioContext;
    audioContext=new AudioContext();
    masterGain=audioContext.createGain();
    masterGain.connect(audioContext.destination);
  }

  if(audioContext.state==="suspended"){
    audioContext.resume();
  }

  masterGain.gain.setValueAtTime(getNormalVolume(),audioContext.currentTime);
  return true;
}

function makeSequence(minutes){
  const style=getMusicStyle();
  const groups=melodies[style][minutes];
  const sequence=[];
  const spacing=style==="westminster"?.82:.56;
  const gap=style==="westminster"?3.65:5.05;

  groups.forEach((group,g)=>{
    group.forEach((note,n)=>{
      sequence.push([note,g*gap+n*spacing]);
    });
  });

  return {sequence,noteSet:notes[style]};
}

function playBell(frequency,delay,hourBell=false){
  if(!audioContext || audioContext.state==="closed" ||
     muted || isQuietTime(new Date()))return;

  const big=getStyle()==="bigben";
  const pitch=big?(hourBell?.79:.88):1;
  const duration=big?(hourBell?8.2:6.2):(hourBell?6.8:4.8);
  const start=audioContext.currentTime+delay;

  const harmonics=[
    [.5,.29,1],
    [1,.49,1],
    [1.49,.19,.78],
    [2,.14,.61],
    [2.72,.09,.46],
    [3.68,.05,.33]
  ];

  harmonics.forEach(([ratio,amount,fade])=>{
    const oscillator=audioContext.createOscillator();
    const gain=audioContext.createGain();

    oscillator.type="sine";
    oscillator.frequency.setValueAtTime(
      frequency*pitch*ratio,start
    );

    gain.gain.setValueAtTime(.0001,start);
    gain.gain.exponentialRampToValueAtTime(amount,start+.03);
    gain.gain.exponentialRampToValueAtTime(
      .0001,start+duration*fade
    );

    oscillator.connect(gain);
    gain.connect(masterGain);

    oscillator.start(start);
    oscillator.stop(start+duration+.2);
  });
}

function playSequence(minutes){
  if(isQuietTime(new Date()))return;
  if(!audioContext || audioContext.state==="closed")return;

  const music=makeSequence(minutes);

  music.sequence.forEach(([note,delay])=>{
    playBell(music.noteSet[note],delay);
  });
}

function sequenceLength(minutes){
  const sequence=makeSequence(minutes).sequence;
  return sequence[sequence.length-1][1]+2.4;
}

function strikeHour(hour,delay){
  const style=getMusicStyle();
  const strikeNote=notes[style].strike;
  let strikes=hour%12||12;
  const spacing=getStyle()==="bigben"?3.8:3.15;

  for(let i=0;i<strikes;i++){
    playBell(strikeNote,delay+i*spacing,true);
  }
}

function createBreathNoise(start,duration){
  const length=Math.floor(audioContext.sampleRate*duration);
  const buffer=audioContext.createBuffer(
    1,length,audioContext.sampleRate
  );

  const data=buffer.getChannelData(0);

  for(let i=0;i<length;i++){
    data[i]=Math.random()*2-1;
  }

  const noise=audioContext.createBufferSource();
  const filter=audioContext.createBiquadFilter();
  const gain=audioContext.createGain();

  noise.buffer=buffer;
  filter.type="bandpass";
  filter.frequency.value=850;
  filter.Q.value=1.3;

  gain.gain.setValueAtTime(.0001,start);
  gain.gain.linearRampToValueAtTime(.055,start+.04);
  gain.gain.exponentialRampToValueAtTime(.0001,start+duration);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);

  noise.start(start);
  noise.stop(start+duration);
}

function playWoodenWhistle(frequency,start,duration){
  const tone=audioContext.createOscillator();
  const overtone=audioContext.createOscillator();
  const overtoneGain=audioContext.createGain();
  const filter=audioContext.createBiquadFilter();
  const gain=audioContext.createGain();

  tone.type="triangle";
  overtone.type="sine";

  tone.frequency.setValueAtTime(frequency*.975,start);
  tone.frequency.exponentialRampToValueAtTime(
    frequency,start+.08
  );

  overtone.frequency.value=frequency*2;
  overtoneGain.gain.value=.12;

  filter.type="lowpass";
  filter.frequency.value=1450;
  filter.Q.value=2.5;

  gain.gain.setValueAtTime(.0001,start);
  gain.gain.linearRampToValueAtTime(.58,start+.055);
  gain.gain.setValueAtTime(.55,start+duration*.62);
  gain.gain.exponentialRampToValueAtTime(.0001,start+duration);

  tone.connect(filter);
  overtone.connect(overtoneGain);
  overtoneGain.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);

  tone.start(start);
  overtone.start(start);
  tone.stop(start+duration+.05);
  overtone.stop(start+duration+.05);

  createBreathNoise(start,duration);
}

function playOneCuckoo(delay){
  if(isQuietTime(new Date()))return;
  if(!prepareAudio())return;
  if(!audioContext || audioContext.state==="closed")return;

  const start=audioContext.currentTime+delay;

  playWoodenWhistle(659.25,start,.34);
  playWoodenWhistle(523.25,start+.39,.62);
}

function playCuckooCalls(count){
  for(let i=0;i<count;i++){
    playOneCuckoo(i*1.45);
  }
}

function playAutomatic(minutes,hour){
  if(!enabled||muted)return;

  if(applyQuietState(new Date())){
    return;
  }

  if(!prepareAudio())return;

  statusDisplay.textContent="Playing "+getName()+".";

  if(getStyle()==="cuckoo"){
    if(minutes===30&&scheduleChoice.value==="quarters"){
      playCuckooCalls(1);
    }

    if(minutes===0){
      playCuckooCalls(hour%12||12);
    }

    return;
  }

  playSequence(minutes);

  if(minutes===0){
    strikeHour(hour,sequenceLength(0));
  }
}


function hourLabel(hour){
  const suffix=hour>=12?"PM":"AM";
  const h=hour%12||12;
  return h+":00 "+suffix;
}

function fillQuietTimes(){
  for(let hour=0;hour<24;hour++){
    const a=document.createElement("option");
    a.value=String(hour);
    a.textContent=hourLabel(hour);
    quietStart.appendChild(a);

    const b=document.createElement("option");
    b.value=String(hour);
    b.textContent=hourLabel(hour);
    quietEnd.appendChild(b);
  }

  quietStart.value=localStorage.getItem("quietStart")||"22";
  quietEnd.value=localStorage.getItem("quietEnd")||"7";
  quietEnabled.checked=localStorage.getItem("quietEnabled")==="true";
}

function isQuietTime(now){
  if(!quietEnabled.checked)return false;

  const start=Number(quietStart.value);
  const end=Number(quietEnd.value);
  const hour=now.getHours();

  // Same start/end means quiet all day.
  if(start===end)return true;

  // Daytime range, such as 8 AM to 5 PM.
  if(start<end)return hour>=start && hour<end;

  // Overnight range, such as 10 PM to 8 AM.
  return hour>=start || hour<end;
}

function applyQuietState(now){
  const quiet=isQuietTime(now);

  if(quiet){
    // HARD SILENCE:
    // Closing the AudioContext immediately stops every current and
    // already-scheduled bell/cuckoo sound from this page.
    if(audioContext && audioContext.state!=="closed"){
      try{
        audioContext.close();
      }catch(e){}
    }

    audioContext=null;
    masterGain=null;

    // The manual test button cannot make sound during Quiet Hours.
    testButton.disabled=true;
    testButton.style.opacity=".45";
    testButton.style.cursor="not-allowed";

    quietStatus.textContent=
      "QUIET NOW — audio engine OFF until "+
      hourLabel(Number(quietEnd.value))+".";
  }else{
    testButton.disabled=false;
    testButton.style.opacity="";
    testButton.style.cursor="";

    if(!quietEnabled.checked){
      quietStatus.textContent="Quiet Hours are OFF.";
    }else{
      quietStatus.textContent=
        "Quiet Hours set for "+hourLabel(Number(quietStart.value))+
        " to "+hourLabel(Number(quietEnd.value))+".";
    }
  }

  return quiet;
}

async function saveQuietSettings(){
  localStorage.setItem("quietEnabled",String(quietEnabled.checked));
  localStorage.setItem("quietStart",quietStart.value);
  localStorage.setItem("quietEnd",quietEnd.value);

  applyQuietState(new Date());
  updateDescription();

  // Always reconcile the iPhone lock-screen schedule immediately.
  // This is important even after the app has been closed/reopened, because
  // iOS can keep older pending notifications alive until we cancel/rebuild them.
  if(enabled){
    await syncLockedPhoneChimes();
  }else{
    await cancelAllLockedChimes();
  }
}

function checkChime(now){
  const quiet=applyQuietState(now);

  if(!enabled)return;
  if(quiet)return;

  const minutes=now.getMinutes();
  const seconds=now.getSeconds();

  let validMinutes;

  if(scheduleChoice.value==="hourly"){
    validMinutes=[0];
  }else if(getStyle()==="cuckoo"){
    validMinutes=[0,30];
  }else{
    validMinutes=[0,15,30,45];
  }

  if(!validMinutes.includes(minutes)||seconds>1)return;

  const key=
    now.getFullYear()+"-"+
    now.getMonth()+"-"+
    now.getDate()+"-"+
    now.getHours()+"-"+
    minutes;

  if(key===lastChimeKey)return;

  lastChimeKey=key;
  playAutomatic(minutes,now.getHours());
}

function updateClock(){
  const now=new Date();

  timeDisplay.textContent=now.toLocaleTimeString([],{
    hour:"numeric",
    minute:"2-digit",
    second:"2-digit"
  });

  dateDisplay.textContent=now.toLocaleDateString([],{
    weekday:"long",
    month:"long",
    day:"numeric",
    year:"numeric"
  });

  checkChime(now);
}

function updateDescription(){
  const cuckoo=getStyle()==="cuckoo";
  const hourly=scheduleChoice.value==="hourly";

  clockIcon.textContent=cuckoo?"🐦":"🔔";

  if(hourly){
    scheduleNote.textContent=cuckoo
      ?"The cuckoo counts the hour at the top of each hour."
      :"The full selected melody and hour strikes play only on the hour.";
  }else{
    scheduleNote.textContent=cuckoo
      ?"Cuckoo once at the half-hour and counts the hour on the hour."
      :"The selected melody plays every quarter hour.";
  }

  if(quietEnabled.checked){
    scheduleNote.textContent += " Quiet Hours: "+
      hourLabel(Number(quietStart.value))+" to "+
      hourLabel(Number(quietEnd.value))+".";
  }

  statusDisplay.textContent=
    getName()+" selected. Press Start Chimes.";
}

startButton.addEventListener("click",async ()=>{
  enabled=true;
  localStorage.setItem("chimesEnabled","true");
  muted=false;
  muteButton.textContent="Mute";

  // Always rebuild the iPhone lock-screen schedule. This first clears
  // any older scheduled notifications that did not obey Quiet Hours.
  await syncLockedPhoneChimes();

  if(applyQuietState(new Date())){
    statusDisplay.textContent=
      "Chimes are ON, but Quiet Hours have shut the audio engine off.";
    return;
  }

  prepareAudio();
  statusDisplay.textContent=getName()+" is on.";
});

testButton.addEventListener("click",()=>{
  if(applyQuietState(new Date())){
    statusDisplay.textContent=
      "BLOCKED — Quiet Hours are active. No test sound can play.";
    return;
  }

  muted=false;
  muteButton.textContent="Mute";

  if(!prepareAudio())return;

  statusDisplay.textContent="Playing "+getName()+".";

  if(getStyle()==="cuckoo"){
    playCuckooCalls(2);
    return;
  }

  playSequence(0);
  const style=getMusicStyle();

  playBell(
    notes[style].strike,
    sequenceLength(0),
    true
  );
});

stopButton.addEventListener("click",async ()=>{
  enabled=false;
  localStorage.setItem("chimesEnabled","false");
  await cancelAllLockedChimes();

  if(audioContext && audioContext.state!=="closed"){
    try{ await audioContext.close(); }catch(e){}
    audioContext=null;
    masterGain=null;
  }

  statusDisplay.textContent="Automatic chimes are stopped.";
});

muteButton.addEventListener("click",async ()=>{
  if(applyQuietState(new Date())){
    statusDisplay.textContent=
      "Quiet Hours are active — the audio engine is already off.";
    return;
  }

  if(!prepareAudio())return;

  muted=!muted;
  muteButton.textContent=muted?"Unmute":"Mute";

  masterGain.gain.setValueAtTime(
    getNormalVolume(),
    audioContext.currentTime
  );

  await syncLockedPhoneChimes();

  statusDisplay.textContent=muted
    ?"Sound is muted."
    :"Sound is unmuted.";
});

soundChoice.addEventListener("change",async ()=>{
  updateDescription();
  if(enabled)await syncLockedPhoneChimes();
});
scheduleChoice.addEventListener("change",async ()=>{
  updateDescription();
  if(enabled)await syncLockedPhoneChimes();
});
quietEnabled.addEventListener("change",saveQuietSettings);
quietStart.addEventListener("change",saveQuietSettings);
quietEnd.addEventListener("change",saveQuietSettings);

volumeSlider.addEventListener("input",()=>{
  volumeValue.textContent=volumeSlider.value;

  if(isQuietTime(new Date())){
    applyQuietState(new Date());
  }else if(masterGain&&audioContext&&audioContext.state!=="closed"){
    masterGain.gain.setValueAtTime(
      getNormalVolume(),
      audioContext.currentTime
    );
  }
});

fillQuietTimes();
updateDescription();
applyQuietState(new Date());
updateClock();

// FIX v4: reconcile native scheduled chimes every time the app starts.
// This clears stale notifications from an older build/session and rebuilds
// only the times allowed by the saved Quiet Hours settings.
(async ()=>{
  if(enabled){
    await syncLockedPhoneChimes();
  }else{
    await cancelAllLockedChimes();
  }
})();

document.addEventListener("visibilitychange",async ()=>{
  if(!document.hidden){
    applyQuietState(new Date());
    updateClock();
    if(enabled){
      await syncLockedPhoneChimes();
    }else{
      await cancelAllLockedChimes();
    }
  }
});

window.addEventListener("focus",async ()=>{
  applyQuietState(new Date());
  updateClock();
  if(enabled){
    await syncLockedPhoneChimes();
  }else{
    await cancelAllLockedChimes();
  }
});

setInterval(updateClock,500);
</script>
</body>
</html>
