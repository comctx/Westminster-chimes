<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Westminster Chimes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #344d68, #172238 55%, #080c14);
    }

    .clock {
      width: 100%;
      max-width: 520px;
      padding: 32px 24px;
      text-align: center;
      border: 3px solid #d4af37;
      border-radius: 24px;
      background: rgba(8, 14, 28, 0.94);
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.65);
    }

    h1 {
      margin: 0 0 10px;
      color: #f3cf62;
      font-family: Georgia, serif;
      font-size: 38px;
    }

    .subtitle {
      margin-bottom: 22px;
      color: #c9d4e5;
      font-size: 17px;
    }

    .bell {
      margin: 12px 0;
      font-size: 76px;
      filter: drop-shadow(0 5px 8px rgba(212, 175, 55, 0.35));
    }

    #time {
      margin: 10px 0;
      font-size: clamp(48px, 13vw, 76px);
      font-weight: bold;
      letter-spacing: 2px;
    }

    #date {
      margin-bottom: 26px;
      color: #d6deea;
      font-size: 20px;
    }

    #status {
      min-height: 25px;
      margin: 18px 0;
      color: #f3cf62;
      font-size: 17px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      min-height: 54px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      color: #111827;
      background: #f3cf62;
    }

    #testButton {
      background: #276749;
    }

    #stopButton {
      background: #9b2c2c;
    }

    #muteButton {
      background: #35465f;
    }

    button:active {
      transform: scale(0.98);
    }

    .volume-box {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #4b5870;
    }

    label {
      display: block;
      margin-bottom: 10px;
    }

    input[type="range"] {
      width: 100%;
    }

    .note {
      margin-top: 22px;
      color: #aebbd0;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      .buttons {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 31px;
      }
    }
  </style>
</head>

<body>
  <main class="clock">
    <h1>Westminster Chimes</h1>

    <div class="subtitle">
      Deep traditional tower bells
    </div>

    <div class="bell">🔔</div>

    <div id="time">--:--:--</div>
    <div id="date">Loading date…</div>

    <div id="status">Press Start Chimes to begin.</div>

    <div class="buttons">
      <button id="startButton">Start Chimes</button>
      <button id="testButton">Test Westminster</button>
      <button id="stopButton">Stop Chimes</button>
      <button id="muteButton">Mute</button>
    </div>

    <div class="volume-box">
      <label for="volume">
        Volume: <span id="volumeValue">60</span>%
      </label>

      <input id="volume" type="range" min="0" max="100" value="60">
    </div>

    <div class="note">
      Keep this page open and press Start Chimes once.
      Chimes play every 15 minutes, with hour strikes on the hour.
    </div>
  </main>

  <script>
    const timeDisplay = document.getElementById("time");
    const dateDisplay = document.getElementById("date");
    const statusDisplay = document.getElementById("status");

    const startButton = document.getElementById("startButton");
    const testButton = document.getElementById("testButton");
    const stopButton = document.getElementById("stopButton");
    const muteButton = document.getElementById("muteButton");

    const volumeSlider = document.getElementById("volume");
    const volumeValue = document.getElementById("volumeValue");

    let audioContext;
    let masterGain;
    let chimesEnabled = false;
    let muted = false;
    let lastChimeKey = "";

    const notes = {
      B3: 246.94,
      E4: 329.63,
      FS4: 369.99,
      GS4: 415.30,
      E3: 164.81
    };

    /*
      Traditional Westminster quarter-hour melody.
    */

    const firstQuarter = [
      ["GS4", 0.00],
      ["FS4", 0.82],
      ["E4", 1.64],
      ["B3", 2.46]
    ];

    const secondQuarter = [
      ["E4", 0.00],
      ["GS4", 0.82],
      ["FS4", 1.64],
      ["B3", 2.46],

      ["E4", 3.65],
      ["FS4", 4.47],
      ["GS4", 5.29],
      ["E4", 6.11]
    ];

    const thirdQuarter = [
      ["GS4", 0.00],
      ["E4", 0.82],
      ["FS4", 1.64],
      ["B3", 2.46],

      ["B3", 3.65],
      ["FS4", 4.47],
      ["GS4", 5.29],
      ["E4", 6.11],

      ["GS4", 7.30],
      ["FS4", 8.12],
      ["E4", 8.94],
      ["B3", 9.76]
    ];

    const fullHour = [
      ["E4", 0.00],
      ["GS4", 0.82],
      ["FS4", 1.64],
      ["B3", 2.46],

      ["E4", 3.65],
      ["FS4", 4.47],
      ["GS4", 5.29],
      ["E4", 6.11],

      ["GS4", 7.30],
      ["E4", 8.12],
      ["FS4", 8.94],
      ["B3", 9.76],

      ["B3", 10.95],
      ["FS4", 11.77],
      ["GS4", 12.59],
      ["E4", 13.41]
    ];

    function getVolume() {
      return muted ? 0 : Number(volumeSlider.value) / 100;
    }

    function prepareAudio() {
      if (!audioContext) {
        const AudioContext =
          window.AudioContext || window.webkitAudioContext;

        audioContext = new AudioContext();
        masterGain = audioContext.createGain();
        masterGain.connect(audioContext.destination);
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      masterGain.gain.setValueAtTime(
        getVolume(),
        audioContext.currentTime
      );
    }

    /*
      Builds a deeper bell using several harmonics.
      Each harmonic fades at a different speed.
    */

    function playTowerBell(frequency, delay, duration = 4.8) {
      if (!audioContext || muted) {
        return;
      }

      const start = audioContext.currentTime + delay;

      const harmonics = [
        { ratio: 0.50, amount: 0.30, fade: 1.00 },
        { ratio: 1.00, amount: 0.48, fade: 1.00 },
        { ratio: 1.50, amount: 0.18, fade: 0.78 },
        { ratio: 2.00, amount: 0.14, fade: 0.62 },
        { ratio: 2.74, amount: 0.09, fade: 0.48 },
        { ratio: 3.76, amount: 0.05, fade: 0.35 }
      ];

      harmonics.forEach(harmonic => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
          frequency * harmonic.ratio,
          start
        );

        gain.gain.setValueAtTime(0.0001, start);

        gain.gain.exponentialRampToValueAtTime(
          Math.max(0.001, harmonic.amount),
          start + 0.025
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          start + duration * harmonic.fade
        );

        oscillator.connect(gain);
        gain.connect(masterGain);

        oscillator.start(start);
        oscillator.stop(start + duration + 0.15);
      });
    }

    function playHourBell(delay) {
      if (!audioContext || muted) {
        return;
      }

      const start = audioContext.currentTime + delay;
      const frequency = notes.E3;

      const harmonics = [
        { ratio: 0.50, amount: 0.42, fade: 1.00 },
        { ratio: 1.00, amount: 0.55, fade: 1.00 },
        { ratio: 1.48, amount: 0.19, fade: 0.78 },
        { ratio: 2.00, amount: 0.15, fade: 0.60 },
        { ratio: 2.66, amount: 0.09, fade: 0.45 },
        { ratio: 3.55, amount: 0.05, fade: 0.32 }
      ];

      harmonics.forEach(harmonic => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
          frequency * harmonic.ratio,
          start
        );

        gain.gain.setValueAtTime(0.0001, start);

        gain.gain.exponentialRampToValueAtTime(
          Math.max(0.001, harmonic.amount),
          start + 0.035
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          start + 6.5 * harmonic.fade
        );

        oscillator.connect(gain);
        gain.connect(masterGain);

        oscillator.start(start);
        oscillator.stop(start + 6.7);
      });
    }

    function playSequence(sequence) {
      prepareAudio();

      sequence.forEach(([note, delay]) => {
        playTowerBell(notes[note], delay);
      });
    }

    function strikeHour(hour, delay) {
      let strikes = hour % 12;

      if (strikes === 0) {
        strikes = 12;
      }

      for (let i = 0; i < strikes; i++) {
        playHourBell(delay + i * 3.15);
      }
    }

    function playQuarterChime(minutes, hour) {
      if (!chimesEnabled || muted) {
        return;
      }

      if (minutes === 15) {
        statusDisplay.textContent =
          "Playing the quarter-hour Westminster chime.";

        playSequence(firstQuarter);
      }

      if (minutes === 30) {
        statusDisplay.textContent =
          "Playing the half-hour Westminster chime.";

        playSequence(secondQuarter);
      }

      if (minutes === 45) {
        statusDisplay.textContent =
          "Playing the three-quarter-hour Westminster chime.";

        playSequence(thirdQuarter);
      }

      if (minutes === 0) {
        statusDisplay.textContent =
          "Playing the full Westminster chime and hour strikes.";

        playSequence(fullHour);
        strikeHour(hour, 15.8);
      }
    }

    function checkForChime(now) {
      if (!chimesEnabled) {
        return;
      }

      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      if (![0, 15, 30, 45].includes(minutes)) {
        return;
      }

      if (seconds > 1) {
        return;
      }

      const chimeKey =
        now.getFullYear() + "-" +
        now.getMonth() + "-" +
        now.getDate() + "-" +
        now.getHours() + "-" +
        minutes;

      if (chimeKey === lastChimeKey) {
        return;
      }

      lastChimeKey = chimeKey;
      playQuarterChime(minutes, now.getHours());
    }

    function updateClock() {
      const now = new Date();

      timeDisplay.textContent = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit"
      });

      dateDisplay.textContent = now.toLocaleDateString([], {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });

      checkForChime(now);
    }

    startButton.addEventListener("click", () => {
      prepareAudio();

      chimesEnabled = true;
      muted = false;
      muteButton.textContent = "Mute";

      masterGain.gain.setValueAtTime(
        getVolume(),
        audioContext.currentTime
      );

      statusDisplay.textContent =
        "Deep Westminster chimes are on.";
    });

    testButton.addEventListener("click", () => {
      prepareAudio();

      muted = false;
      muteButton.textContent = "Mute";

      masterGain.gain.setValueAtTime(
        getVolume(),
        audioContext.currentTime
      );

      statusDisplay.textContent =
        "Playing the full Westminster melody.";

      playSequence(fullHour);
      playHourBell(15.8);
    });

    stopButton.addEventListener("click", () => {
      chimesEnabled = false;

      statusDisplay.textContent =
        "Automatic chimes are stopped.";
    });

    muteButton.addEventListener("click", () => {
      prepareAudio();

      muted = !muted;
      muteButton.textContent = muted ? "Unmute" : "Mute";

      masterGain.gain.setValueAtTime(
        getVolume(),
        audioContext.currentTime
      );

      statusDisplay.textContent = muted
        ? "Sound is muted."
        : "Sound is unmuted.";
    });

    volumeSlider.addEventListener("input", () => {
      volumeValue.textContent = volumeSlider.value;

      if (masterGain && audioContext) {
        masterGain.gain.setValueAtTime(
          getVolume(),
          audioContext.currentTime
        );
      }
    });

    updateClock();
    setInterval(updateClock, 500);
  </script>
</body>
</html>
