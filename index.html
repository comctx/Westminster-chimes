<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clock Tower Chimes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #344d68, #172238 55%, #080c14);
    }

    .clock {
      width: 100%;
      max-width: 540px;
      padding: 32px 24px;
      text-align: center;
      border: 3px solid #d4af37;
      border-radius: 24px;
      background: rgba(8, 14, 28, 0.94);
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.65);
    }

    h1 {
      margin: 0 0 10px;
      color: #f3cf62;
      font: bold 38px Georgia, serif;
    }

    .subtitle {
      margin-bottom: 20px;
      color: #c9d4e5;
      font-size: 17px;
    }

    .bell {
      margin: 10px 0;
      font-size: 76px;
      filter: drop-shadow(0 5px 8px rgba(212, 175, 55, 0.35));
    }

    #time {
      margin: 10px 0;
      font-size: clamp(48px, 13vw, 76px);
      font-weight: bold;
      letter-spacing: 2px;
    }

    #date {
      margin-bottom: 24px;
      color: #d6deea;
      font-size: 20px;
    }

    .sound-box {
      margin: 16px 0;
      padding: 16px;
      border: 1px solid #596982;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #e4eaf3;
      font-weight: bold;
    }

    select {
      width: 100%;
      min-height: 48px;
      padding: 10px;
      border: 2px solid #d4af37;
      border-radius: 10px;
      color: #172238;
      background: white;
      font-size: 17px;
      font-weight: bold;
    }

    #status {
      min-height: 25px;
      margin: 18px 0;
      color: #f3cf62;
      font-size: 17px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      min-height: 54px;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      color: #111827;
      background: #f3cf62;
    }

    #testButton {
      background: #276749;
    }

    #stopButton {
      background: #9b2c2c;
    }

    #muteButton {
      background: #35465f;
    }

    button:active {
      transform: scale(0.98);
    }

    .volume-box {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #4b5870;
    }

    input[type="range"] {
      width: 100%;
    }

    .note {
      margin-top: 22px;
      color: #aebbd0;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      .buttons {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 31px;
      }
    }
  </style>
</head>

<body>
  <main class="clock">
    <h1>Clock Tower Chimes</h1>

    <div class="subtitle">Traditional clocks and tower melodies</div>
    <div class="bell" id="clockIcon">🔔</div>

    <div id="time">--:--:--</div>
    <div id="date">Loading date…</div>

    <div class="sound-box">
      <label for="soundChoice">Choose a chime</label>

      <select id="soundChoice">
        <option value="westminster">Westminster Tower Bells</option>
        <option value="bigben">Big Ben — London</option>
        <option value="whittington">Whittington Chimes</option>
        <option value="stmichael">St. Michael Chimes</option>
        <option value="cuckoo">Traditional Cuckoo Clock</option>
      </select>
    </div>

    <div id="status">Press Start Chimes to begin.</div>

    <div class="buttons">
      <button id="startButton">Start Chimes</button>
      <button id="testButton">Test Selected Chime</button>
      <button id="stopButton">Stop Chimes</button>
      <button id="muteButton">Mute</button>
    </div>

    <div class="volume-box">
      <label for="volume">
        Volume: <span id="volumeValue">60</span>%
      </label>

      <input id="volume" type="range" min="0" max="100" value="60">
    </div>

    <div class="note" id="scheduleNote">
      Press Start Chimes once for automatic quarter-hour chimes.
    </div>
  </main>

  <script>
    const timeDisplay = document.getElementById("time");
    const dateDisplay = document.getElementById("date");
    const statusDisplay = document.getElementById("status");
    const soundChoice = document.getElementById("soundChoice");
    const startButton = document.getElementById("startButton");
    const testButton = document.getElementById("testButton");
    const stopButton = document.getElementById("stopButton");
    const muteButton = document.getElementById("muteButton");
    const volumeSlider = document.getElementById("volume");
    const volumeValue = document.getElementById("volumeValue");
    const clockIcon = document.getElementById("clockIcon");
    const scheduleNote = document.getElementById("scheduleNote");

    let audioContext;
    let masterGain;
    let enabled = false;
    let muted = false;
    let lastChimeKey = "";

    const noteSets = {
      westminster: {
        B3: 246.94,
        E4: 329.63,
        FS4: 369.99,
        GS4: 415.30,
        STRIKE: 164.81
      },

      whittington: {
        N1: 293.66,
        N2: 329.63,
        N3: 369.99,
        N4: 392.00,
        N5: 440.00,
        N6: 493.88,
        N7: 554.37,
        N8: 587.33,
        STRIKE: 146.83
      },

      stmichael: {
        N1: 349.23,
        N2: 392.00,
        N3: 440.00,
        N4: 466.16,
        N5: 523.25,
        N6: 587.33,
        N7: 659.25,
        N8: 698.46,
        STRIKE: 174.61
      }
    };

    function timedGroups(groups, gap = 5.05, spacing = 0.56) {
      const result = [];
      let groupStart = 0;

      groups.forEach(group => {
        group.forEach((note, index) => {
          result.push([note, groupStart + index * spacing]);
        });

        groupStart += gap;
      });

      return result;
    }

    const westminster = {
      15: timedGroups([
        ["GS4", "FS4", "E4", "B3"]
      ], 3.65, 0.82),

      30: timedGroups([
        ["E4", "GS4", "FS4", "B3"],
        ["E4", "FS4", "GS4", "E4"]
      ], 3.65, 0.82),

      45: timedGroups([
        ["GS4", "E4", "FS4", "B3"],
        ["B3", "FS4", "GS4", "E4"],
        ["GS4", "FS4", "E4", "B3"]
      ], 3.65, 0.82),

      0: timedGroups([
        ["E4", "GS4", "FS4", "B3"],
        ["E4", "FS4", "GS4", "E4"],
        ["GS4", "E4", "FS4", "B3"],
        ["B3", "FS4", "GS4", "E4"]
      ], 3.65, 0.82)
    };

    const W1 = ["N8", "N7", "N6", "N5", "N4", "N3", "N2", "N1"];
    const W2A = ["N8", "N2", "N7", "N3", "N6", "N4", "N5", "N1"];
    const W2B = ["N8", "N6", "N4", "N2", "N7", "N5", "N3", "N1"];
    const W3A = ["N8", "N7", "N4", "N3", "N6", "N5", "N2", "N1"];
    const W3B = ["N2", "N4", "N6", "N8", "N5", "N2", "N3", "N1"];

    const whittington = {
      15: timedGroups([W1]),
      30: timedGroups([W2A, W2B]),
      45: timedGroups([W3A, W3B, W1]),
      0: timedGroups([W2A, W2B, W3A, W3B])
    };

    const S1 = ["N8", "N7", "N6", "N5", "N4", "N3", "N2", "N1"];
    const S2A = ["N8", "N2", "N3", "N4", "N7", "N5", "N6", "N1"];
    const S2B = ["N5", "N4", "N3", "N6", "N2", "N7", "N8", "N1"];
    const S3A = ["N7", "N8", "N3", "N4", "N2", "N5", "N6", "N1"];
    const S3B = ["N5", "N7", "N3", "N8", "N4", "N2", "N6", "N1"];

    const stMichael = {
      15: timedGroups([S1]),
      30: timedGroups([S2A, S2B]),
      45: timedGroups([S3A, S3B, S1]),
      0: timedGroups([S2A, S2B, S3A, S3B])
    };

    function getVolume() {
      return muted ? 0 : Number(volumeSlider.value) / 100;
    }

    function getStyle() {
      return soundChoice.value;
    }

    function getName() {
      const names = {
        westminster: "Westminster Tower Bells",
        bigben: "Big Ben",
        whittington: "Whittington Chimes",
        stmichael: "St. Michael Chimes",
        cuckoo: "Traditional Cuckoo Clock"
      };

      return names[getStyle()];
    }

    function prepareAudio() {
      if (!audioContext) {
        const AudioContext =
          window.AudioContext || window.webkitAudioContext;

        audioContext = new AudioContext();
        masterGain = audioContext.createGain();
        masterGain.connect(audioContext.destination);
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      masterGain.gain.setValueAtTime(
        getVolume(),
        audioContext.currentTime
      );
    }

    function getMusic(minutes) {
      if (getStyle() === "whittington") {
        return {
          sequence: whittington[minutes],
          notes: noteSets.whittington
        };
      }

      if (getStyle() === "stmichael") {
        return {
          sequence: stMichael[minutes],
          notes: noteSets.stmichael
        };
      }

      return {
        sequence: westminster[minutes],
        notes: noteSets.westminster
      };
    }

    function bellSettings(hourBell) {
      if (getStyle() === "bigben") {
        return {
          pitch: hourBell ? 0.79 : 0.88,
          duration: hourBell ? 8.2 : 6.2
        };
      }

      if (getStyle() === "stmichael") {
        return {
          pitch: 1,
          duration: hourBell ? 7.2 : 4.5
        };
      }

      return {
        pitch: 1,
        duration: hourBell ? 6.7 : 4.8
      };
    }

    function playBell(frequency, delay, hourBell = false) {
      if (!audioContext || muted) {
        return;
      }

      const settings = bellSettings(hourBell);
      const start = audioContext.currentTime + delay;

      const harmonics = [
        [0.50, 0.29, 1.00],
        [1.00, 0.49, 1.00],
        [1.49, 0.19, 0.78],
        [2.00, 0.14, 0.61],
        [2.72, 0.09, 0.46],
        [3.68, 0.05, 0.33]
      ];

      harmonics.forEach(([ratio, amount, fade]) => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
          frequency * settings.pitch * ratio,
          start
        );

        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(amount, start + 0.03);

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          start + settings.duration * fade
        );

        oscillator.connect(gain);
        gain.connect(masterGain);

        oscillator.start(start);
        oscillator.stop(start + settings.duration + 0.2);
      });
    }

    function playSequence(minutes) {
      prepareAudio();

      const music = getMusic(minutes);

      music.sequence.forEach(([note, delay]) => {
        playBell(music.notes[note], delay);
      });
    }

    function sequenceLength(minutes) {
      const sequence = getMusic(minutes).sequence;
      return sequence[sequence.length - 1][1] + 2.4;
    }

    function strikeHour(hour, delay) {
      const notes = getMusic(0).notes;
      let strikes = hour % 12;

      if (strikes === 0) {
        strikes = 12;
      }

      const spacing = getStyle() === "bigben" ? 3.8 : 3.15;

      for (let i = 0; i < strikes; i++) {
        playBell(notes.STRIKE, delay + i * spacing, true);
      }
    }

    function playCuckooNote(frequency, start, duration) {
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const filter = audioContext.createBiquadFilter();

      oscillator.type = "triangle";
      oscillator.frequency.setValueAtTime(frequency, start);

      filter.type = "lowpass";
      filter.frequency.setValueAtTime(1300, start);
      filter.Q.setValueAtTime(3, start);

      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.5, start + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);

      oscillator.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain);

      oscillator.start(start);
      oscillator.stop(start + duration + 0.05);
    }

    function playOneCuckoo(delay) {
      prepareAudio();

      const start = audioContext.currentTime + delay;

      playCuckooNote(783.99, start, 0.42);
      playCuckooNote(523.25, start + 0.46, 0.62);
    }

    function playCuckooCalls(numberOfCalls) {
      prepareAudio();

      for (let i = 0; i < numberOfCalls; i++) {
        playOneCuckoo(i * 1.55);
      }
    }

    function playAutomatic(minutes, hour) {
      if (!enabled || muted) {
        return;
      }

      statusDisplay.textContent = "Playing " + getName() + ".";

      if (getStyle() === "cuckoo") {
        if (minutes === 30) {
          playCuckooCalls(1);
        }

        if (minutes === 0) {
          let calls = hour % 12;

          if (calls === 0) {
            calls = 12;
          }

          playCuckooCalls(calls);
        }

        return;
      }

      playSequence(minutes);

      if (minutes === 0) {
        strikeHour(hour, sequenceLength(0));
      }
    }

    function checkChime(now) {
      if (!enabled) {
        return;
      }

      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      const validMinutes =
        getStyle() === "cuckoo"
          ? [0, 30]
          : [0, 15, 30, 45];

      if (!validMinutes.includes(minutes) || seconds > 1) {
        return;
      }

      const key =
        now.getFullYear() + "-" +
        now.getMonth() + "-" +
        now.getDate() + "-" +
        now.getHours() + "-" +
        minutes;

      if (key === lastChimeKey) {
        return;
      }

      lastChimeKey = key;
      playAutomatic(minutes, now.getHours());
    }

    function updateClock() {
      const now = new Date();

      timeDisplay.textContent = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit"
      });

      dateDisplay.textContent = now.toLocaleDateString([], {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });

      checkChime(now);
    }

    startButton.addEventListener("click", () => {
      prepareAudio();
      enabled = true;
      muted = false;
      muteButton.textContent = "Mute";
      statusDisplay.textContent = getName() + " is on.";
    });

    testButton.addEventListener("click", () => {
      prepareAudio();
      muted = false;
      muteButton.textContent = "Mute";
      statusDisplay.textContent = "Playing " + getName() + ".";

      if (getStyle() === "cuckoo") {
        playCuckooCalls(2);
        return;
      }

      playSequence(0);

      const music = getMusic(0);

      playBell(
        music.notes.STRIKE,
        sequenceLength(0),
        true
      );
    });

    stopButton.addEventListener("click", () => {
      enabled = false;
      statusDisplay.textContent = "Automatic chimes are stopped.";
    });

    muteButton.addEventListener("click", () => {
      prepareAudio();
      muted = !muted;
      muteButton.textContent = muted ? "Unmute" : "Mute";

      masterGain.gain.setValueAtTime(
        getVolume(),
        audioContext.currentTime
      );

      statusDisplay.textContent = muted
        ? "Sound is muted."
        : "Sound is unmuted.";
    });

    soundChoice.addEventListener("change", () => {
      const cuckooSelected = getStyle() === "cuckoo";

      clockIcon.textContent = cuckooSelected ? "🐦" : "🔔";

      scheduleNote.textContent = cuckooSelected
        ? "Cuckoo once at the half-hour and counts the hour on the hour."
        : "Press Start Chimes once for automatic quarter-hour chimes.";

      statusDisplay.textContent =
        getName() + " selected. Press Test Selected Chime.";
    });

    volumeSlider.addEventListener("input", () => {
      volumeValue.textContent = volumeSlider.value;

      if (masterGain && audioContext) {
        masterGain.gain.setValueAtTime(
          getVolume(),
          audioContext.currentTime
        );
      }
    });

    updateClock();
    setInterval(updateClock, 500);
  </script>
</body>
</html>
