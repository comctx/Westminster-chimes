<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Clock Tower Chimes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: white;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #344d68, #172238 55%, #080c14);
    }

    .clock {
      width: 100%;
      max-width: 540px;
      padding: 32px 24px;
      text-align: center;
      border: 3px solid #d4af37;
      border-radius: 24px;
      background: rgba(8, 14, 28, 0.94);
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.65);
    }

    h1 {
      margin: 0 0 10px;
      color: #f3cf62;
      font-family: Georgia, serif;
      font-size: 38px;
    }

    .subtitle {
      margin-bottom: 20px;
      color: #c9d4e5;
      font-size: 17px;
    }

    .bell {
      margin: 10px 0;
      font-size: 76px;
      filter: drop-shadow(0 5px 8px rgba(212, 175, 55, 0.35));
    }

    #time {
      margin: 10px 0;
      font-size: clamp(48px, 13vw, 76px);
      font-weight: bold;
      letter-spacing: 2px;
    }

    #date {
      margin-bottom: 24px;
      color: #d6deea;
      font-size: 20px;
    }

    .sound-box {
      margin: 16px 0;
      padding: 16px;
      border: 1px solid #596982;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.05);
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: #e4eaf3;
      font-weight: bold;
    }

    select {
      width: 100%;
      min-height: 48px;
      padding: 10px;
      border: 2px solid #d4af37;
      border-radius: 10px;
      color: #172238;
      background: white;
      font-size: 17px;
      font-weight: bold;
    }

    #status {
      min-height: 25px;
      margin: 18px 0;
      color: #f3cf62;
      font-size: 17px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      min-height: 54px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      color: #111827;
      background: #f3cf62;
    }

    #testButton {
      background: #276749;
    }

    #stopButton {
      background: #9b2c2c;
    }

    #muteButton {
      background: #35465f;
    }

    button:active {
      transform: scale(0.98);
    }

    .volume-box {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #4b5870;
    }

    input[type="range"] {
      width: 100%;
    }

    .note {
      margin-top: 22px;
      color: #aebbd0;
      font-size: 14px;
      line-height: 1.5;
    }

    @media (max-width: 420px) {
      .buttons {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 31px;
      }
    }
  </style>
</head>

<body>
  <main class="clock">
    <h1>Clock Tower Chimes</h1>

    <div class="subtitle">
      Traditional clock and tower melodies
    </div>

    <div class="bell">🔔</div>

    <div id="time">--:--:--</div>
    <div id="date">Loading date…</div>

    <div class="sound-box">
      <label for="soundChoice">Choose a chime</label>

      <select id="soundChoice">
        <option value="westminster">
          Westminster Tower Bells
        </option>

        <option value="bigben">
          Big Ben — London
        </option>

        <option value="whittington">
          Whittington Chimes
        </option>
      </select>
    </div>

    <div id="status">Press Start Chimes to begin.</div>

    <div class="buttons">
      <button id="startButton">Start Chimes</button>
      <button id="testButton">Test Selected Chime</button>
      <button id="stopButton">Stop Chimes</button>
      <button id="muteButton">Mute</button>
    </div>

    <div class="volume-box">
      <label for="volume">
        Volume: <span id="volumeValue">60</span>%
      </label>

      <input id="volume" type="range" min="0" max="100" value="60">
    </div>

    <div class="note">
      Select a melody and press Test Selected Chime.
      Press Start Chimes once for automatic quarter-hour chimes.
    </div>
  </main>

  <script>
    const timeDisplay = document.getElementById("time");
    const dateDisplay = document.getElementById("date");
    const statusDisplay = document.getElementById("status");

    const soundChoice = document.getElementById("soundChoice");
    const startButton = document.getElementById("startButton");
    const testButton = document.getElementById("testButton");
    const stopButton = document.getElementById("stopButton");
    const muteButton = document.getElementById("muteButton");

    const volumeSlider = document.getElementById("volume");
    const volumeValue = document.getElementById("volumeValue");

    let audioContext;
    let masterGain;
    let chimesEnabled = false;
    let muted = false;
    let lastChimeKey = "";

    const westminsterNotes = {
      B3: 246.94,
      E4: 329.63,
      FS4: 369.99,
      GS4: 415.30,
      E3: 164.81
    };

    const westminster = {
      15: [
        ["GS4", 0.00], ["FS4", 0.82],
        ["E4", 1.64], ["B3", 2.46]
      ],

      30: [
        ["E4", 0.00], ["GS4", 0.82],
        ["FS4", 1.64], ["B3", 2.46],

        ["E4", 3.65], ["FS4", 4.47],
        ["GS4", 5.29], ["E4", 6.11]
      ],

      45: [
        ["GS4", 0.00], ["E4", 0.82],
        ["FS4", 1.64], ["B3", 2.46],

        ["B3", 3.65], ["FS4", 4.47],
        ["GS4", 5.29], ["E4", 6.11],

        ["GS4", 7.30], ["FS4", 8.12],
        ["E4", 8.94], ["B3", 9.76]
      ],

      0: [
        ["E4", 0.00], ["GS4", 0.82],
        ["FS4", 1.64], ["B3", 2.46],

        ["E4", 3.65], ["FS4", 4.47],
        ["GS4", 5.29], ["E4", 6.11],

        ["GS4", 7.30], ["E4", 8.12],
        ["FS4", 8.94], ["B3", 9.76],

        ["B3", 10.95], ["FS4", 11.77],
        ["GS4", 12.59], ["E4", 13.41]
      ]
    };

    const whittingtonNotes = {
      D4: 293.66,
      E4: 329.63,
      FS4: 369.99,
      G4: 392.00,
      A4: 440.00,
      B4: 493.88,
      CS5: 554.37,
      D5: 587.33,
      D3: 146.83
    };

    const W1 = [
      "D5", "CS5", "B4", "A4",
      "G4", "FS4", "E4", "D4"
    ];

    const W2A = [
      "D5", "E4", "CS5", "FS4",
      "B4", "G4", "A4", "D4"
    ];

    const W2B = [
      "D5", "B4", "G4", "E4",
      "CS5", "A4", "FS4", "D4"
    ];

    const W3A = [
      "D5", "CS5", "G4", "FS4",
      "B4", "A4", "E4", "D4"
    ];

    const W3B = [
      "E4", "G4", "B4", "D5",
      "A4", "E4", "FS4", "D4"
    ];

    function makeWhittingtonSequence(groups) {
      const result = [];
      let start = 0;

      groups.forEach(group => {
        group.forEach((note, index) => {
          result.push([note, start + index * 0.56]);
        });

        start += 5.05;
      });

      return result;
    }

    const whittington = {
      15: makeWhittingtonSequence([W1]),
      30: makeWhittingtonSequence([W2A, W2B]),
      45: makeWhittingtonSequence([W3A, W3B, W1]),
      0: makeWhittingtonSequence([W2A, W2B, W3A, W3B])
    };

    function getVolume() {
      return muted ? 0 : Number(volumeSlider.value) / 100;
    }

    function getSoundName() {
      if (soundChoice.value === "bigben") {
        return "Big Ben";
      }

      if (soundChoice.value === "whittington") {
        return "Whittington Chimes";
      }

      return "Westminster Tower Bells";
    }

    function prepareAudio() {
      if (!audioContext) {
        const AudioContext =
          window.AudioContext || window.webkitAudioContext;

        audioContext = new AudioContext();
        masterGain = audioContext.createGain();
        masterGain.connect(audioContext.destination);
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      masterGain.gain.setValueAtTime(
        getVolume(),
        audioContext.currentTime
      );
    }

    function getBellSettings(hourBell) {
      const style = soundChoice.value;

      if (style === "bigben") {
        return {
          pitch: hourBell ? 0.79 : 0.88,
          duration: hourBell ? 8.2 : 6.2,
          harmonics: [
            [0.50, 0.48, 1.00],
            [1.00, 0.61, 1.00],
            [1.48, 0.23, 0.82],
            [2.00, 0.18, 0.67],
            [2.68, 0.11, 0.50],
            [3.58, 0.06, 0.36]
          ]
        };
      }

      if (style === "whittington") {
        return {
          pitch: 1.00,
          duration: hourBell ? 6.8 : 4.3,
          harmonics: [
            [0.50, 0.26, 1.00],
            [1.00, 0.47, 1.00],
            [1.51, 0.19, 0.76],
            [2.00, 0.13, 0.58],
            [2.72, 0.08, 0.43],
            [3.68, 0.04, 0.31]
          ]
        };
      }

      return {
        pitch: 1.00,
        duration: hourBell ? 6.5 : 4.8,
        harmonics: [
          [0.50, 0.30, 1.00],
          [1.00, 0.50, 1.00],
          [1.50, 0.18, 0.78],
          [2.00, 0.14, 0.62],
          [2.74, 0.09, 0.48],
          [3.76, 0.05, 0.35]
        ]
      };
    }

    function playBell(frequency, delay, hourBell = false) {
      if (!audioContext || muted) {
        return;
      }

      const settings = getBellSettings(hourBell);
      const start = audioContext.currentTime + delay;

      settings.harmonics.forEach(harmonic => {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();

        oscillator.type = "sine";

        oscillator.frequency.setValueAtTime(
          frequency * settings.pitch * harmonic[0],
          start
        );

        gain.gain.setValueAtTime(0.0001, start);

        gain.gain.exponentialRampToValueAtTime(
          Math.max(0.001, harmonic[1]),
          start + 0.03
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          start + settings.duration * harmonic[2]
        );

        oscillator.connect(gain);
        gain.connect(masterGain);

        oscillator.start(start);
        oscillator.stop(start + settings.duration + 0.2);
      });
    }

    function getCurrentMusic(minutes) {
      if (soundChoice.value === "whittington") {
        return {
          sequence: whittington[minutes],
          notes: whittingtonNotes,
          strikeNote: whittingtonNotes.D3
        };
      }

      return {
        sequence: westminster[minutes],
        notes: westminsterNotes,
        strikeNote: westminsterNotes.E3
      };
    }

    function playSequence(minutes) {
      prepareAudio();

      const music = getCurrentMusic(minutes);

      music.sequence.forEach(([note, delay]) => {
        playBell(music.notes[note], delay, false);
      });
    }

    function getSequenceLength(minutes) {
      const music = getCurrentMusic(minutes);
      const lastNote = music.sequence[music.sequence.length - 1];

      return lastNote[1] + 2.4;
    }

    function strikeHour(hour, delay) {
      const music = getCurrentMusic(0);
      let strikes = hour % 12;

      if (strikes === 0) {
        strikes = 12;
      }

      const spacing =
        soundChoice.value === "bigben" ? 3.8 : 3.15;

      for (let i = 0; i < strikes; i++) {
        playBell(
          music.strikeNote,
          delay + i * spacing,
          true
        );
      }
    }

    function playQuarterChime(minutes, hour) {
      if (!chimesEnabled || muted) {
        return;
      }

      statusDisplay.textContent =
        "Playing " + getSoundName() + ".";

      playSequence(minutes);

      if (minutes === 0) {
        strikeHour(hour, getSequenceLength(0));
      }
    }

    function checkForChime(now) {
      if (!chimesEnabled) {
        return;
      }

      const minutes = now.getMinutes();
      const seconds = now.getSeconds();

      if (![0, 15, 30, 45].includes(minutes) || seconds > 1) {
        return;
      }

      const chimeKey =
        now.getFullYear() + "-" +
        now.getMonth() + "-" +
        now.getDate() + "-" +
        now.getHours() + "-" +
        minutes;

      if (chimeKey === lastChimeKey) {
        return;
      }

      lastChimeKey = chimeKey;
      playQuarterChime(minutes, now.getHours());
    }

    function updateClock() {
      const now = new Date();

      timeDisplay.textContent = now.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit",
        second: "2-digit"
      });

      dateDisplay.textContent = now.toLocaleDateString([], {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric"
      });

      checkForChime(now);
    }

    startButton.addEventListener("click", () => {
      prepareAudio();

      chimesEnabled = true;
      muted = false;
      muteButton.textContent = "Mute";

      masterGain.gain.setValueAtTime(
        getVolume(),
        audioContext.currentTime
      );

      statusDisplay.textContent =
        getSoundName() + " are on.";
    });

    testButton.addEventListener("click", () => {
      prepareAudio();

      muted = false;
      muteButton.textContent = "Mute";

      masterGain.gain.setValueAtTime(
        getVolume(),
        audioContext.currentTime
      );

      statusDisplay.textContent =
        "Playing " + getSoundName() + ".";

      playSequence(0);

      const music = getCurrentMusic(0);

      playBell(
        music.strikeNote,
        getSequenceLength(0),
        true
      );
    });

    stopButton.addEventListener("click", () => {
      chimesEnabled = false;
      statusDisplay.textContent = "Automatic chimes are stopped.";
    });

    muteButton.addEventListener("click", () => {
      prepareAudio();

      muted = !muted;
      muteButton.textContent = muted ? "Unmute" : "Mute";

      masterGain.gain.setValueAtTime(
        getVolume(),
        audioContext.currentTime
      );

      statusDisplay.textContent = muted
        ? "Sound is muted."
        : "Sound is unmuted.";
    });

    soundChoice.addEventListener("change", () => {
      statusDisplay.textContent =
        getSoundName() + " selected. Press Test Selected Chime.";
    });

    volumeSlider.addEventListener("input", () => {
      volumeValue.textContent = volumeSlider.value;

      if (masterGain && audioContext) {
        masterGain.gain.setValueAtTime(
          getVolume(),
          audioContext.currentTime
        );
      }
    });

    updateClock();
    setInterval(updateClock, 500);
  </script>
</body>
</html>
