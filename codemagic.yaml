workflows:
  ios-workflow:
    name: Westminster Chimes iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: Codemagic

    environment:
      node: latest
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.donaldreckman.westminsterchimes"

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Create iOS project
        script: |
          rm -rf ios www
          mkdir -p www
          cp index.html www/index.html
          if [ -f support.html ]; then cp support.html www/support.html; fi
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.donaldreckman.westminsterchimes",
            "appName": "Westminster Chimes",
            "webDir": "www"
          }
          EOF
          npx cap add ios

      - name: Sync Westminster Chimes
        script: |
          npx cap sync ios

      - name: Get Apple signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates

      - name: Apply Apple signing
        script: |
          cd ios/App
          xcode-project use-profiles

      - name: Build signed iOS app
        script: |
          cd ios/App
          xcode-project build-ipa --workspace App.xcworkspace --scheme App

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
