workflows:
  ios-workflow:
    name: Westminster Chimes iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: latest
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Create iOS project
        script: |
          npx cap add ios || true

      - name: Sync Westminster Chimes
        script: |
          npx cap sync ios

      - name: Build iOS app
        script: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive

    artifacts:
      - build/**/*.xcarchive
      - ios/App/build/**/*.app
      - /tmp/xcodebuild_logs/*.log
